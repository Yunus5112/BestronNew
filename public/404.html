<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestron Technology</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8fafc;
        color: #334155;
      }
      .loading {
        text-align: center;
      }
      .spinner {
        border: 3px solid #e2e8f0;
        border-top: 3px solid #0b2b7a;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // Note: this 404.html file must be at least 512 bytes for it to work
      // with Internet Explorer (it is currently > 512 bytes)

      // If you're creating a Project Pages site and NOT using a custom domain,
      // then set pathSegmentsToKeep to 1 (enterprise users may need to set it to > 1).
      // This way the code will only replace the route part of the path, and not
      // the real directory in which the app resides, for example:
      // https://username.github.io/repo-name/one/two?a=b&c=d#qwe becomes
      // https://username.github.io/repo-name/?/one/two&a=b~and~c=d#qwe
      // Otherwise, leave pathSegmentsToKeep as 0.
      // Custom domain kullanılıyorsa 0 olmalı
      var pathSegmentsToKeep = 0;

      var l = window.location;
      
      // Eğer URL zaten ?/ ile başlıyorsa (query string'de redirect var), redirect yapma (döngü önleme)
      if (l.search && l.search.length > 1 && l.search[1] === '/') {
        // Zaten düzeltilmiş URL, ana sayfaya yönlendir
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname + l.search + l.hash);
        return;
      }
      
      // Ana sayfa ise redirect yapma
      if (l.pathname === '/' || l.pathname === '/index.html' || l.pathname.endsWith('/index.html')) {
        return;
      }
      
      // Gerçek 404 durumunda redirect yap
      // /projects -> /?/projects
      var basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var pathSegments = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep);
      var redirectPath = pathSegments.join('/').replace(/&/g, '~and~');
      
      var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/?/' + redirectPath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      
      // Yeni URL mevcut URL ile aynı değilse redirect yap
      if (newUrl !== l.href) {
        l.replace(newUrl);
      }
    </script>
  </head>
  <body>
    <div class="loading">
      <div class="spinner"></div>
      <p>Yönlendiriliyor...</p>
    </div>
  </body>
</html>
